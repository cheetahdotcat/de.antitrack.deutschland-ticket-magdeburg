# A signed release for every tag v*: builds on the runner's Android SDK,
# signs with the key from repository secrets, and attaches the APK and its
# SHA-256 to a GitHub release. Secrets (Settings → Secrets → Actions):
#   MVB_CLIENT_ID, MVB_CLIENT_SECRET           the MVB OAuth client
#   ANTITRACK_KEYSTORE_BASE64                  base64 of release.jks
#   ANTITRACK_KEYSTORE_PASSWORD                its password
#   ANTITRACK_KEY_ALIAS                        optional, default antitrack
#   ANTITRACK_KEY_PASSWORD                     optional, default = store password
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Tag matches versionName
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != versionName $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Keystore
        env:
          KS: ${{ secrets.ANTITRACK_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS" ] || { echo "ANTITRACK_KEYSTORE_BASE64 not set"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANTITRACK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          MVB_CLIENT_ID: ${{ secrets.MVB_CLIENT_ID }}
          MVB_CLIENT_SECRET: ${{ secrets.MVB_CLIENT_SECRET }}
          ANTITRACK_KEYSTORE_PASSWORD: ${{ secrets.ANTITRACK_KEYSTORE_PASSWORD }}
          ANTITRACK_KEY_ALIAS: ${{ secrets.ANTITRACK_KEY_ALIAS }}
          ANTITRACK_KEY_PASSWORD: ${{ secrets.ANTITRACK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --console=plain :app:assembleRelease

      - name: Verify and name
        run: |
          out="d-ticket-magdeburg-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$out" | grep -E "DN|SHA-256"
          sha256sum "$out" > "$out.sha256"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            d-ticket-magdeburg-${{ env.VERSION }}.apk
            d-ticket-magdeburg-${{ env.VERSION }}.apk.sha256
